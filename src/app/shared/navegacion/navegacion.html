<nav class="riel" [attr.aria-label]="'navegacion.principal' | translate">
  <a class="logo" routerLink="/" [attr.aria-label]="'navegacion.inicio' | translate">gp</a>

  <button
    type="button"
    class="item"
    [class.activo]="panelAbierto()"
    [attr.aria-expanded]="panelAbierto()"
    aria-controls="panel-proyectos"
    (click)="alternarPanel()"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2h9A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"
      />
    </svg>
    <span>{{ 'navegacion.proyectos' | translate }}</span>
  </button>

  <!-- Muestra el idioma en uso; al tocarlo se despliega la lista. -->
  <div #selectorIdioma class="idioma abajo">
    <button
      #botonIdioma
      type="button"
      class="item"
      [class.abierto]="idiomaAbierto()"
      [attr.aria-expanded]="idiomaAbierto()"
      aria-controls="menu-idioma"
      [attr.aria-label]="('navegacion.idioma' | translate) + ': ' + nombres[idioma.actual()]"
      (click)="alternarIdioma()"
    >
      <span class="codigo">
        {{ idioma.actual() }}
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" /></svg>
      </span>
    </button>

    @if (idiomaAbierto()) {
      <ul id="menu-idioma" class="menu-idioma">
        @for (codigo of idiomas; track codigo) {
          @let enUso = codigo === idioma.actual();
          <li>
            <button
              type="button"
              class="opcion"
              [class.en-uso]="enUso"
              [attr.lang]="codigo"
              [attr.aria-current]="enUso ? 'true' : null"
              (click)="elegirIdioma(codigo)"
            >
              {{ nombres[codigo] }}
              @if (enUso) {
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" /></svg>
              }
            </button>
          </li>
        }
      </ul>
    }
  </div>

  <button
    #botonTema
    type="button"
    class="item"
    [attr.aria-label]="
      (tema.modo() === 'oscuro' ? 'navegacion.modoClaro' : 'navegacion.modoOscuro') | translate
    "
    (click)="tema.alternar(botonTema)"
  >
    <!-- Un svg por modo: al cambiar se crea de nuevo y entra girando. -->
    @if (tema.modo() === 'oscuro') {
      <svg class="icono-tema" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
        />
      </svg>
    } @else {
      <svg class="icono-tema" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
      </svg>
    }
  </button>
</nav>

@if (panelAbierto()) {
  <nav id="panel-proyectos" class="panel" [attr.aria-label]="'navegacion.proyectos' | translate">
    <h2 class="panel-titulo">{{ 'navegacion.proyectos' | translate }}</h2>
    <ul>
      @for (proyecto of proyectos; track proyecto.url) {
        <li>
          <a class="enlace" [href]="proyecto.url" [appSalida]="proyecto">
            {{ proyecto.nombre }}
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8" /></svg>
          </a>
        </li>
      }
    </ul>
  </nav>
}
